<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sunset Vector Mechanics - Physics Lab</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0f172a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #f8fafc;
        }

        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to bottom, #fdba74 0%, #f97316 35%, #9a3412 70%, #1e1b4b 100%);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        /* 2-Second Landscape Popup Illustration */
        #orientationOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }

        .phone-icon {
            width: 50px;
            height: 90px;
            border: 3px solid #fbbf24;
            border-radius: 8px;
            animation: rotatePhone 1.5s infinite ease-in-out;
            margin-bottom: 12px;
            position: relative;
        }

        .phone-icon::after {
            content: '';
            position: absolute;
            top: 6px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 3px;
            background: #fbbf24;
            border-radius: 2px;
        }

        @keyframes rotatePhone {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(-90deg); }
            100% { transform: rotate(-90deg); }
        }

        .overlay-text {
            font-size: 13px;
            font-weight: 700;
            color: #f8fafc;
            letter-spacing: 0.5px;
            text-align: center;
        }

        /* Smaller Compact HUD Panel (Top-Left) */
        .hud-panel {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            padding: 8px 10px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
            width: 180px;
            z-index: 10;
        }

        /* Smaller Compact Telemetry Panel (Top-Right) */
        .telemetry-panel {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            padding: 8px 10px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
            width: 150px;
            z-index: 10;
        }

        /* Centered Top Instructions */
        .info-card {
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 10px;
            color: #cbd5e1;
            text-align: center;
            pointer-events: none;
            white-space: nowrap;
            z-index: 10;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        }

        .info-card span {
            color: #38bdf8;
            font-weight: 700;
        }

        .hud-title {
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #fbbf24;
            text-transform: uppercase;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
        }

        .control-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            margin-bottom: 4px;
            font-size: 9px;
            color: #cbd5e1;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 60px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            outline: none;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #fbbf24;
            cursor: pointer;
        }

        .btn-reset {
            width: 100%;
            margin-top: 4px;
            padding: 4px;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            border: none;
            border-radius: 4px;
            color: white;
            font-weight: 700;
            font-size: 9px;
            text-transform: uppercase;
            cursor: pointer;
        }

        .telemetry-row {
            display: flex;
            justify-content: space-between;
            font-size: 9px;
            margin-bottom: 2px;
            color: #cbd5e1;
        }

        .telemetry-row span {
            color: #38bdf8;
            font-weight: 700;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        <!-- 2 Sec Landscape Rotate Popup -->
        <div id="orientationOverlay">
            <div class="phone-icon"></div>
            <div class="overlay-text">ROTATE DEVICE TO LANDSCAPE</div>
        </div>

        <!-- HUD Panel (Top-Left) -->
        <div class="hud-panel">
            <div class="hud-title">
                <span>Physics Lab</span>
                <span style="font-size: 8px; color: #38bdf8;">NLM</span>
            </div>

            <div class="control-group">
                <label>&mu;: <span id="fVal">0.010</span></label>
                <input id="friction" type="range" min="0.001" max="0.03" step="0.001" value="0.010">
            </div>

            <div class="control-group">
                <label>e: <span id="rVal">0.85</span></label>
                <input id="restitution" type="range" min="0.2" max="1.0" step="0.05" value="0.85">
            </div>

            <button id="resetBtn" class="btn-reset">Reset Scene</button>
        </div>

        <!-- Centered Instruction Header -->
        <div class="info-card">
            🎯 <span>Pull back</span> on rocks to launch | 🏹 Vectors show <span>&vec;v</span>
        </div>

        <!-- Velocity & Momentum Meter (Top-Right) -->
        <div class="telemetry-panel">
            <div class="hud-title" style="color: #38bdf8;">
                <span>Telemetry</span>
            </div>
            <div class="telemetry-row">
                <label>Max Vel:</label>
                <span id="maxVel">0.0 m/s</span>
            </div>
            <div class="telemetry-row">
                <label>Momentum:</label>
                <span id="sysMomentum">0.0</span>
            </div>
            <div class="telemetry-row">
                <label>Rocks:</label>
                <span id="rockCount">5</span>
            </div>
        </div>

        <canvas id="simCanvas"></canvas>
    </div>

    <script>
        // Auto-hide orientation overlay after 2 seconds
        setTimeout(() => {
            const overlay = document.getElementById('orientationOverlay');
            overlay.style.opacity = '0';
            setTimeout(() => overlay.style.display = 'none', 500);
        }, 2000);

        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        const frictionInput = document.getElementById('friction');
        const restitutionInput = document.getElementById('restitution');
        const fVal = document.getElementById('fVal');
        const rVal = document.getElementById('rVal');
        const resetBtn = document.getElementById('resetBtn');

        const maxVelDisplay = document.getElementById('maxVel');
        const sysMomentumDisplay = document.getElementById('sysMomentum');
        const rockCountDisplay = document.getElementById('rockCount');

        let width, height;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        frictionInput.addEventListener('input', () => fVal.textContent = parseFloat(frictionInput.value).toFixed(3));
        restitutionInput.addEventListener('input', () => rVal.textContent = parseFloat(restitutionInput.value).toFixed(2));

        const sun = { x: 0, y: 0, radius: 80 };
        let particles = [];

        class Entity {
            constructor(x, y, radius, mass) {
                this.x = x;
                this.y = y;
                this.radius = radius;
                this.mass = mass;
                this.vx = 0;
                this.vy = 0;
            }

            update(friction) {
                this.x += this.vx;
                this.y += this.vy;

                this.vx *= (1 - friction);
                this.vy *= (1 - friction);

                if (Math.hypot(this.vx, this.vy) < 0.05) {
                    this.vx = 0;
                    this.vy = 0;
                }

                if (Math.hypot(this.vx, this.vy) > 0.8 && Math.random() < 0.4) {
                    particles.push({
                        x: this.x,
                        y: this.y + this.radius * 0.5,
                        vx: (Math.random() - 0.5) * 0.5,
                        vy: -Math.random() * 0.5,
                        life: 1.0,
                        size: Math.random() * 3 + 1.5
                    });
                }

                if (this.x - this.radius < 0) { this.x = this.radius; this.vx *= -0.8; }
                if (this.x + this.radius > width) { this.x = width - this.radius; this.vx *= -0.8; }
                if (this.y - this.radius < height * 0.25) { this.y = height * 0.25 + this.radius; this.vy *= -0.8; }
                if (this.y + this.radius > height - 10) { this.y = height - 10 - this.radius; this.vy *= -0.8; }
            }

            draw() {
                ctx.save();
                ctx.beginPath();
                ctx.ellipse(this.x, this.y + this.radius * 0.7, this.radius, this.radius * 0.3, 0, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.fill();

                let grad = ctx.createRadialGradient(
                    this.x - this.radius * 0.3, this.y - this.radius * 0.3, this.radius * 0.1,
                    this.x, this.y, this.radius
                );
                grad.addColorStop(0, '#94a3b8');
                grad.addColorStop(0.7, '#475569');
                grad.addColorStop(1, '#1e293b');

                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();
                ctx.strokeStyle = '#cbd5e1';
                ctx.lineWidth = 1.2;
                ctx.stroke();

                const speed = Math.hypot(this.vx, this.vy);
                if (speed > 0.2) {
                    drawArrow(this.x, this.y, this.x + this.vx * 12, this.y + this.vy * 12, '#38bdf8', speed.toFixed(1));
                }
                ctx.restore();
            }
        }

        let entities = [];
        function initScene() {
            sun.x = width * 0.75;
            sun.y = height * 0.32;
            
            entities = [
                new Entity(width * 0.2, height * 0.6, 22, 2),
                new Entity(width * 0.4, height * 0.55, 26, 3.5),
                new Entity(width * 0.35, height * 0.75, 18, 1.5),
                new Entity(width * 0.6, height * 0.65, 24, 3.0),
                new Entity(width * 0.75, height * 0.5, 22, 2.5)
            ];
        }
        initScene();
        resetBtn.addEventListener('click', initScene);

        function drawArrow(fromx, fromy, tox, toy, color = '#38bdf8', label = '') {
            const headlen = 7;
            const dx = tox - fromx;
            const dy = toy - fromy;
            const angle = Math.atan2(dy, dx);

            ctx.save();
            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            ctx.lineWidth = 2;

            ctx.beginPath();
            ctx.moveTo(fromx, fromy);
            ctx.lineTo(tox, toy);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(tox, toy);
            ctx.lineTo(tox - headlen * Math.cos(angle - Math.PI / 6), toy - headlen * Math.sin(angle - Math.PI / 6));
            ctx.lineTo(tox - headlen * Math.cos(angle + Math.PI / 6), toy - headlen * Math.sin(angle + Math.PI / 6));
            ctx.fill();

            if (label) {
                ctx.font = '9px monospace';
                ctx.fillStyle = '#f8fafc';
                ctx.fillText(label + 'v', tox + 6, toy - 3);
            }
            ctx.restore();
        }

        function resolveCollisions() {
            const e = parseFloat(restitutionInput.value);

            for (let i = 0; i < entities.length; i++) {
                for (let j = i + 1; j < entities.length; j++) {
                    let a = entities[i];
                    let b = entities[j];

                    let dx = b.x - a.x;
                    let dy = b.y - a.y;
                    let dist = Math.hypot(dx, dy);

                    if (dist < a.radius + b.radius) {
                        let overlap = (a.radius + b.radius) - dist;
                        let nx = dx / dist;
                        let ny = dy / dist;

                        a.x -= nx * overlap / 2;
                        a.y -= ny * overlap / 2;
                        b.x += nx * overlap / 2;
                        b.y += ny * overlap / 2;

                        let kx = a.vx - b.vx;
                        let ky = a.vy - b.vy;
                        let p = 2 * (nx * kx + ny * ky) / (a.mass + b.mass);

                        a.vx -= p * b.mass * nx * e;
                        a.vy -= p * b.mass * ny * e;
                        b.vx += p * a.mass * nx * e;
                        b.vy += p * a.mass * ny * e;
                    }
                }
            }
        }

        let dragObject = null;
        let dragStart = { x: 0, y: 0 };
        let currentMouse = { x: 0, y: 0 };
        let isDragging = false;

        function getPos(evt) {
            const rect = canvas.getBoundingClientRect();
            const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
            const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        function startDrag(evt) {
            const pos = getPos(evt);
            for (let ent of entities) {
                if (Math.hypot(pos.x - ent.x, pos.y - ent.y) < ent.radius * 1.4) {
                    dragObject = ent;
                    isDragging = true;
                    dragStart = { x: ent.x, y: ent.y };
                    currentMouse = pos;
                    break;
                }
            }
        }

        function drag(evt) {
            if (!isDragging) return;
            currentMouse = getPos(evt);
        }

        function endDrag() {
            if (!isDragging || !dragObject) return;
            
            const launchVector = {
                x: (dragStart.x - currentMouse.x) * 0.12,
                y: (dragStart.y - currentMouse.y) * 0.12
            };

            dragObject.vx = launchVector.x;
            dragObject.vy = launchVector.y;

            isDragging = false;
            dragObject = null;
        }

        canvas.addEventListener('mousedown', startDrag);
        canvas.addEventListener('touchstart', startDrag, { passive: true });
        window.addEventListener('mousemove', drag);
        window.addEventListener('touchmove', drag, { passive: true });
        window.addEventListener('mouseup', endDrag);
        window.addEventListener('touchend', endDrag);

        function drawSunset() {
            let sunGrad = ctx.createRadialGradient(sun.x, sun.y, 10, sun.x, sun.y, sun.radius * 2);
            sunGrad.addColorStop(0, '#fef08a');
            sunGrad.addColorStop(0.3, '#fde047');
            sunGrad.addColorStop(1, 'rgba(251, 146, 60, 0)');
            ctx.fillStyle = sunGrad;
            ctx.beginPath();
            ctx.arc(sun.x, sun.y, sun.radius * 2, 0, Math.PI * 2);
            ctx.fill();

            let groundGrad = ctx.createLinearGradient(0, height * 0.4, 0, height);
            groundGrad.addColorStop(0, '#1e1b4b');
            groundGrad.addColorStop(0.2, '#311042');
            groundGrad.addColorStop(1, '#0f172a');
            ctx.fillStyle = groundGrad;
            ctx.fillRect(0, height * 0.35, width, height * 0.65);
        }

        function updateTelemetry() {
            let maxV = 0;
            let totalMomentumX = 0;
            let totalMomentumY = 0;

            entities.forEach(ent => {
                let v = Math.hypot(ent.vx, ent.vy);
                if (v > maxV) maxV = v;
                totalMomentumX += ent.mass * ent.vx;
                totalMomentumY += ent.mass * ent.vy;
            });

            let sysMom = Math.hypot(totalMomentumX, totalMomentumY);

            maxVelDisplay.textContent = maxV.toFixed(1) + ' m/s';
            sysMomentumDisplay.textContent = sysMom.toFixed(1);
            rockCountDisplay.textContent = entities.length;
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);

            drawSunset();

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.03;
                if (p.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }
                ctx.fillStyle = `rgba(251, 146, 60, ${p.life * 0.6})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            }

            const friction = parseFloat(frictionInput.value);

            entities.forEach(ent => ent.update(friction));
            resolveCollisions();
            updateTelemetry();

            entities.forEach(ent => ent.draw());

            if (isDragging && dragObject) {
                const dx = dragStart.x - currentMouse.x;
                const dy = dragStart.y - currentMouse.y;

                ctx.beginPath();
                ctx.moveTo(dragObject.x, dragObject.y);
                ctx.lineTo(currentMouse.x, currentMouse.y);
                ctx.strokeStyle = '#f59e0b';
                ctx.lineWidth = 2;
                ctx.stroke();

                drawArrow(
                    dragObject.x, 
                    dragObject.y, 
                    dragObject.x + dx * 2, 
                    dragObject.y + dy * 2, 
                    '#4ade80',
                    'Aim '
                );
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
